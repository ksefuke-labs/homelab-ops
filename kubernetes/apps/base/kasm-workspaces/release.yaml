apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kasm-workspaces
  namespace: kasm-workspaces
spec:
  interval: 30m
  chart:
    spec:
      chart: kasm
      version: '1.1190.6'
      sourceRef:
        kind: HelmRepository
        name: kasmweb
        namespace: kasm-workspaces
  values:
    deploymentSize: "small"

    # publicAddr -- Set the access URL to be used for the Kasm deployment. This is the URL you will use to access
    # your Kasm deployment. This URL can be a private address, it just needs to be resolvable by systems you use
    # to interface with Kasm.
    # 
    # If you create a self-signed or custom certificate, this is the value you should assign as the Common Name
    # associated with the certificate. If `certificate.certManager.enabled` is set to true, this is the
    # name used to generate the certificate.
    #
    publicAddr: "kasm.ksefuke-labs.com"
    directRdpService:
      # directRdpService.enabled -- Enable the exposure of the RDP Gateway service via a separate Service of the type defined in
      # `directRdpService.type`. This is only applicable if you have enabled the Kasm RDP Gateway component in `components.rdpGateway.enabled`.
      #
      enabled: false
      # directRdpService.rdpAccessURL -- If you are exposing the RDP Gateway service via a separate Service, set the access URL
      # to be used for the RDP Gateway. This is the URL you will use to access the RDP Gateway service and must be resolvable by
      # your users' systems.
      #
      rdpAccessURL: ""
      # directRdpService.type -- The service type to use for the RDP Gateway service if `directRdpService.enabled` is set to true.
      # Allowed values are LoadBalancer or NodePort. The RDP Gateway speaks raw TCP, so any cloud load balancer backing this
      # Service must be a Layer 4 / TCP type (e.g. NLB on AWS, not ALB).
      #
      type: LoadBalancer
      # directRdpService.loadBalancerPort -- The external port exposed by the directRdpService Service when
      # `directRdpService.type` is LoadBalancer. Defaults to 3389. Has no effect when `directRdpService.type` is NodePort.
      #
      loadBalancerPort: 3389
      # directRdpService.annotations -- Custom annotations to add to the RDP Gateway Service. This only applies if `directRdpService.enabled`
      # is set to true. If you use the annotations below to deploy a load balancer in your cloud provider, you must ensure the load balancer
      # type supports RDP. This typically requires using a Network Load Balancer type that supports TCP load balancing, and not a HTTP/HTTPS
      # load balancer type.
      #
      annotations: {}
      labels: {}

    # Configure an Ingress for your Kasm deployment. 
    # 
    ingress:
      # ingress.enabled -- Set the enabled value to `true` to use a pre-defined Ingress service to expose Kasm
      #
      enabled: true
      # ingress.tls -- Set tls value to `true` to eanble TLS configuration for the hostname defined at `publicAddr` parameter
      #
      tls: true
      # ingress.backendProtocol -- The backend protocol to for the Ingress to communicate with the Kasm proxy service.
      # Valid values: http or https
      #
      backendProtocol: http
      # ingress.ingressClassName -- Define the ingress Class to use for your Kasm ingress
      #
      ingressClassName: "traefik"
      annotations: {}
      labels: {}

    certificate:
      # certificate.secretName -- Set the secret name where the certificate is stored.
      # This secret name will store a certificate created by `cert-manager` if you set `cert-manager.enabled` to true
      #
      secretName: "prod-ksefuke-labs-tls"
      certManager:
        enabled: true
        addWildCard: true
        issuerName: "letsencrypt-production"
        issuerKind: "ClusterIssuer"
        issuerGroup: ""
        annotations: {}
        labels: {}

    kasmSecrets:
      # kasmSecrets.create -- Set to false to use an existing Kasm Password secret. Default = `true`.
      #
      create: true
      # kasmSecrets.name -- The name of the Kasm Password secret to create. If a value is provided here and `create=true`,
      # Helm will use that as the secret name. If `create=false` then you MUST provide the name of an existing Kasm Password
      # secret in your deployment namespace.
      #
      name: ""
      # kasmSecrets.passwords -- Set any of the five well-known keys below to a non-empty value to pin that credential to
      # a specific value instead of letting the chart generate (or preserve, on upgrade) a random one. An explicitly set
      # value here always wins, even if a Secret with that key already exists in the namespace.
      #
      # This object also accepts additional, arbitrary keys beyond the five below. Any extra key you add is written into
      # the generated Secret's `data` as a literal base64-encoded value (no random generation, since the chart has no
      # other source of truth for a custom key) - useful for seeding extra application secrets alongside the standard
      # Kasm credentials.
      #
      # NOTE: Only used when `kasmSecrets.create` is `true`. Has no effect when referencing an existing secret.
      #
      passwords:
        manager-token: ""
        service-token: ""
        db-password: ""
        admin-password: ""
        user-password: ""
      # Example additional custom secret value:
      #   my-custom-secret: "some-value"
      # kasmSecrets.annotations -- Custom annotations to add to the Kasm Password secret
      annotations: {}
      # kasmSecrets.labels -- Custom labels to add to the Kasm Kasm Password secret
      labels: {}

    # useImageTags -- Chart-wide image tag used when a component's `image.tag` is empty. Per-component tag wins if set.
    # To override the tag for a single component, see `components.<x>.image.tag` (or `database.image.tag`).
    # Examples:
    #   "1.19.0-rolling"             rolling tag, receives ongoing bug-fix updates within 1.19.x
    #   "1.19.0"                     frozen point-in-time tag
    #   "1.19.0-rolling-2026-06-02"  date-locked rolling tag, pins a specific rolling build
    #
    useImageTags: "1.19.0-rolling"

    # Kasm DB settings and configuration options
    #
    database:
      # database.standalone -- Setting standalone to true will prevent the deployment of the Kasm DB StatefulSet and requires
      # the user to have a self-hosted PostgreSQL Database v16 server already setup and awaiting connections. Use the below
      # database configuration values to connect to your external DB.
      # see, https://docs.kasm.com/docs/latest/how-to/remote_database#requirements for list of full db requirements.
      standalone: false
      # database.hostname -- The hostname of the external PostgreSQL server.
      # Only used when database.standalone is true.
      hostname: ""
      # database.port -- The port Kasm will use to connect to the PostgreSQL DB server
      #
      port: 5432
      # database.kasmDbName -- The name of the database where Kasm is to be initialized and that Kasm services are to connect
      #
      kasmDbName: kasm
      # database.kasmDbUser -- The name of the Kasm database User with READ/WRITE permission to the Kasm database
      #
      kasmDbUser: kasmapp
      # database.kasmDbSecret -- The name of the Kasm database password secret to use for a user-created, custom Database password
      # secret value.
      #
      # NOTE: Leave this empty to use the password created by this Helm chart. If you create a custom DB secret, define the `kasmDbSecret`
      # object below in the example format.
      #
      kasmDbSecret: {}
      # Example Custom DB Secret configuration
      #   name: kasm-db-secret
      #   key: kasm-db-secret-key

      # database.postgresMasterUser -- An object defining the PostgreSQL DB Master user and the Kubernetes secret and key values for
      # the Master DB password. These credentials are only used by the `db-init-job` to create the `kasmDbName` database, the `kasmDbUser`
      # user account, set permissions for the user account, and initialize and pre-seed the Kasm Database.
      #
      postgresMasterUser: {}
      # Example DB Master User configuration
      #   username: postgres
      #   secret:
      #     name: postgres-secret
      #     key: db-password

      # database.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
      # container registry instead of our public DockerHub hosted one.
      #
      image:
        registry: docker.io
        repository: kasmweb/postgres
        # database.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
        tag: ""

    # Configure the Kasm Database management functions
    #
    dbManagement:
      initialize: true
      upgrade:
        enable: false
  
      # Configuration settings for the Kasm API service
      api:
        # components.api.image -- Configure the image repository where the image is stored. Use this to point to an private hosted
        # container registry instead of our public DockerHub hosted one.
        image:
          registry: docker.io
          repository: kasmweb/api
          # components.api.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
          tag: ""
        # components.api.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
        replicas: 0

      # Configuration settings for the Kasm Manager service
      #
      manager:
        image:
          registry: docker.io
          repository: kasmweb/manager
          # components.manager.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
          tag: ""
        # components.manager.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
        replicas: 0

      guac:
        image:
          registry: docker.io
          repository: kasmweb/kasm-guac
          # components.guac.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
          tag: ""
        enabled: true
        # components.guac.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
        replicas: 0

      # Configuration settings for the Kasm RDP Gateway service
      #
      rdpGateway:
        image:
          registry: docker.io
          repository: kasmweb/rdp-gateway
          # components.rdpGateway.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
          tag: ""
        # components.rdpGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP Gateway service - 
        # [Kasm RDP Gateway](https://docs.kasm.com/docs/latest/guide/connection_proxies#rdp-gateway).
        #
        enabled: true
        # components.rdpGateway.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
        # NOTE: must be 0 (preset) or 1. Multi-replica rdp-gateway is not supported
        # in this release.
        replicas: 0

      # Configuration settings for the Kasm RDP HTTPS Gateway service
      rdpHttpsGateway:
        image:
          registry: docker.io
          repository: kasmweb/rdp-https-gateway
          # components.rdpHttpsGateway.image.tag -- Tag for this component's image. Leave empty to fall back to the chart-wide `useImageTags`.
          tag: ""
        # components.rdpHttpsGateway.enabled -- Use this setting to enable/disable deployment of the Kasm RDP HTTPS Gateway service.
        # This service allows users to use native RDP clients via HTTPS connections rather than exposing 3389 - 
        # [Kasm RDP HTTPS Gateway](https://docs.kasm.com/docs/latest/guide/connection_proxies#rdp-https-gateway).
        #
        enabled: true
        # components.rdpHttpsGateway.replicas -- Override the replica count set by deploymentSize. Set to 0 to use the deploymentSize preset (default).
        replicas: 0

    ####################################
    # Extra Kubernetes config settings #
    ####################################

    # clusterDomain -- Cluster-wide Kubernetes DNS domain name
    clusterDomain: "cluster.local"

    # nodeSelector -- Configure node selector settings for your Kasm pods -
    # [Kubernetes Node Selector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector).
    nodeSelector: {}

    # affinity -- Configure node affinity settings for Kasm pods - 
    # [Kubernetes Affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).
    # Kasm is not guaranteed to work with Affinity settings - use caution if you must configuring these settings.
    # The below, optional object passes in raw Affinity rules for Pods, Nodes, etc. for your environment. Make sure you
    # use the correct values below as this Helm chart will not do any error checking for you.
    affinity: {}
    # applySecurity -- Apply Pod/Container security settings for Kasm resources
    applySecurity: true

    # applyHealthChecks -- Add Pod/Container healthchecks settings for Kasm resources
    applyHealthChecks: true

    # restartPolicy -- Configure global Pod restart policy for Kasm resources
    restartPolicy: "Always"

    kasmConfig:
      # kasmConfig.generatePreseed -- Enable generation of a custom DB initialization configuration to
      # pre-configure Kasm during installation.
      #
      generatePreseed: false
      # kasmConfig.defaultUsers -- Creates a series of 4 users and 5 groups with a standard set of
      # permissions accommodating most standard deployment scenarios. Refer to the [Default Users](./docs/default-users.md)
      # for additional information about what this flag creates.
      #
      defaultUsers: false
      # kasmConfig.defaultApiUsers -- Creates two predefined sets of API credentials with permissions
      # accommodating most standard deployment scenarios. Refer to the [Default API Users](./docs/default-api-users.md)
      # for additional information about what this flag creates.
      #
      defaultApiUsers: false
      # kasmConfig.adminUsername -- Change the username seeded on the admin-group member. Default: `admin@kasm.local`,
      # the only true built-in admin account. Setting this to any other value seeds that account with generated
      # (non-built-in) credentials stored under a `<local-part>-password`/`<local-part>-salt` key pair in the
      # passwords/salts Secrets (e.g. `system@kasm.local` -> `system-password`) instead of the built-in
      # admin-password-Secret-backed credentials. The chart will not create an `admin-password` key at all in that
      # case, and the db-init Job will not be given a DEFAULT_ADMIN_PASSWORD env var. See docs/default-users.md.
      #
      adminUsername: "admin@kasm.local"