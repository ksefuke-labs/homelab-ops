apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
  namespace: miniflux
spec:
  instances: 2
  bootstrap:
    initdb:
      database: app
      owner: miniflux #Set to db username
      secret:
        name: miniflux-db-creds #secret containing username/password in basic auth
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-global
    major: 18 #pin to major version required by app
  storage:
    storageClass: longhorn-cnpg
    size: 5Gi
