apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calibre-web
  template:
    metadata:
      labels:
        app: calibre-web
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - image: lscr.io/linuxserver/calibre-web:latest
        name: calibre-web
        ports: 
          - containerPort: 8083
        envFrom:
          - configMapRef:
              name: calibre-web-configmap
        resources:
            limits:
              memory: 1Gi
        volumeMounts:
          - mountPath: /books
            name: calibre-web-books-data
          - mountPath: /config
            name: calibre-web-config-data
      initContainers:
        - name: fix-perms
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /books /config"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /books
              name: calibre-web-books-data
            - mountPath: /config
              name: calibre-web-config-data

      volumes:
        - name: calibre-web-books-data
          persistentVolumeClaim: # PVC Claim in storage.yaml
            claimName: calibre-web-book-pvc
        - name: calibre-web-config-data
          persistentVolumeClaim: # PVC Claim in storage.yaml
            claimName: calibre-web-config-pvc