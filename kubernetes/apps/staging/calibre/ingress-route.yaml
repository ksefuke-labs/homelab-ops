apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre
  namespace: calibre
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`cali.ksefuke-labs.com`)
    services:
    - name: calibre
      namespace: calibre
      port: 8083
  tls:
    secretName: prod-ksefuke-labs-tls