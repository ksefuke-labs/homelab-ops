apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniflux
  namespace: miniflux
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`mf.ksefuke-labs.com`)
    services:
    - name: miniflux
      namespace: miniflux
      port: 8080
  tls:
    secretName: prod-ksefuke-labs-tls