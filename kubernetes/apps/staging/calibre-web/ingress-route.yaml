apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`calibre.ksefuke-labs.com`)
    services:
    - name: calibre-web
      namespace: calibre-web
      port: 8083
  tls:
    secretName: prod-ksefuke-labs-tls