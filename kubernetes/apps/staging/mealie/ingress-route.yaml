apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie
  namespace: mealie
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`mealie.ksefuke-labs.com`)
    services:
    - name: mealie
      namespace: mealie
      port: 9000
  tls:
    secretName: prod-ksefuke-labs-tls