apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: metrics-server
  targetNamespace: metrics-server
  values:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      #limits:
      #  cpu:
      #  memory: